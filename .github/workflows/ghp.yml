name: ghp checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]

permissions:
  contents: read

jobs:
  gate:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      issues: read
    uses: praveenlavu/spec-kit-ghp/.github/workflows/ghp-gate.yml@e440627644e6e5268ef3ce19ee4547f75799e03d
    with:
      ghp_ref: e440627644e6e5268ef3ce19ee4547f75799e03d

  branch-guard:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      issues: read
    uses: praveenlavu/spec-kit-ghp/.github/workflows/ghp-branch-guard.yml@e440627644e6e5268ef3ce19ee4547f75799e03d
    with:
      ghp_ref: e440627644e6e5268ef3ce19ee4547f75799e03d

  strict-verify:
    if: github.event.action != 'closed'
    permissions:
      contents: read
    uses: praveenlavu/spec-kit-ghp/.github/workflows/ghp-strict-verify.yml@e440627644e6e5268ef3ce19ee4547f75799e03d
    with:
      ghp_ref: e440627644e6e5268ef3ce19ee4547f75799e03d
      allow-override: false

  link:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    permissions:
      contents: read
      issues: write
    uses: praveenlavu/spec-kit-ghp/.github/workflows/ghp-link-on-merge.yml@e440627644e6e5268ef3ce19ee4547f75799e03d
    with:
      ghp_ref: e440627644e6e5268ef3ce19ee4547f75799e03d
      close-story: false
    secrets:
      GHP_PROJECT_TOKEN: ${{ secrets.GHP_PROJECT_TOKEN }}
